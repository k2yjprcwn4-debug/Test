<style>
:root{--bg:#08121e;--panel:#101f30;--panel2:#142639;--line:#2b4054;--text:#f4f7fa;--sub:#a5b8c8;--muted:#8298a8;--lime:#c4f56e;--mint:#74e3bd;--blue:#8cc9ff;--orange:#f4bc85;--red:#e59a92;--border:1px solid var(--line);--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:3px}button:disabled{opacity:.42;cursor:not-allowed}.app{max-width:520px;min-height:100dvh;margin:0 auto;position:relative;padding:0 17px calc(112px + env(safe-area-inset-bottom))}.masthead{display:flex;align-items:center;justify-content:space-between;padding:21px 2px 18px}.logo{font-size:21px;font-weight:900;letter-spacing:-1.2px}.logo b{color:var(--lime)}.tag{background:#25364a;border:1px solid #3a4c60;border-radius:100px;color:#c2d1dc;padding:6px 10px;font-weight:700;font-size:11px;letter-spacing:.4px}.section{margin-top:26px}.muted{color:var(--sub)}.eyebrow{letter-spacing:2px;text-transform:uppercase;font-size:10px;font-weight:900;color:var(--mint)}.h1{font-size:36px;letter-spacing:-1.7px;line-height:1.1;margin:10px 0}.title{font-size:24px;line-height:1.15;letter-spacing:-.8px;margin:2px 0 11px;font-weight:840}.subhead{font-size:14px;color:var(--sub);margin:0 0 16px}.hero{padding:25px 22px;background:radial-gradient(ellipse at 100% 0%,#284a51 0%,transparent 58%),linear-gradient(140deg,#193449,#10263c 70%);border:1px solid #3a5e60;border-radius:26px;position:relative;overflow:hidden}.hero:before{content:'↗';position:absolute;font-weight:800;font-size:145px;color:#d3ffaa0b;right:12px;top:0;transform:rotate(-10deg)}.hero strong{color:var(--lime)}.hero .sub{max-width:300px;color:#c7d8de;font-size:13px;margin:15px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.stat{border-radius:17px;background:var(--panel);border:var(--border);padding:13px 12px}.stat strong{display:block;font-size:22px;letter-spacing:-.7px;font-variant-numeric:tabular-nums}.stat span{display:block;font-size:11px;color:var(--sub)}.progress{height:7px;background:#273a46;border-radius:10px;overflow:hidden}.progress>i{display:block;background:linear-gradient(90deg,var(--mint),var(--lime));height:100%;transition:width .4s}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-width:0;background:var(--panel);border:var(--border);border-radius:14px;padding:10px 1px;text-align:center}.day.today{border-color:var(--lime);background:#24362e}.day .dow{display:block;font-size:11px;color:var(--sub)}.day .date{display:block;font-size:16px;font-weight:800}.day .dot{display:block;height:5px;width:5px;border-radius:100%;background:var(--mint);margin:3px auto 0}.day .nodot{background:transparent}.card{background:var(--panel);border:var(--border);border-radius:var(--radius);padding:18px;margin:10px 0}.workout{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:12px}.tile{display:grid;place-items:center;height:54px;width:54px;border-radius:17px;font-size:25px;background:#2d4149}.tile.pm{background:#2b3855}.tile.mini{background:#37372f}.workout .name{font-weight:820;font-size:17px}.workout .detail{font-size:12px;color:var(--sub);margin:4px 0}.chev{font-size:26px;color:var(--lime);font-weight:200}.pill{display:inline-block;border:1px solid #3e544a;border-radius:100px;padding:3px 8px;color:var(--mint);font-size:10px;font-weight:800}.pill.done{background:#254d40;border-color:#477966;color:#a9efcc}.pill.optional{color:#bfd0db;border-color:#42536b}.switchbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.chip{border-radius:12px;padding:12px 10px;background:#11283b;border:1px solid #405166;color:#c9dae7;font-weight:730;text-align:center;font-size:12px}.chip.on{background:#263f31;color:var(--lime);border-color:#88b76a}.chip.warn.on{background:#4a3034;border-color:#b17e7e;color:#ffe2e0}.smallNote{font-size:12px;color:var(--sub);line-height:1.6}.btn{border:none;background:var(--lime);color:#142218;border-radius:14px;padding:14px 17px;font-weight:850;font-size:14px;transition:transform .1s}.btn:active{transform:scale(.985)}.btn.secondary{background:#293e51;color:var(--text);border:1px solid #40566a}.btn.ghost{background:transparent;border:1px solid #4b6070;color:#d8e6ef}.btn.danger{background:#4b2933;color:#ffd2d0}.btn.sm{padding:9px 12px;font-size:12px;border-radius:10px}.btn.full{width:100%}.workoutCard{display:grid;width:100%;text-align:left;color:inherit}.footnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:calc(76px + env(safe-area-inset-bottom));padding:7px 13px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #2f4255;background:#0d1928ed;backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.navbtn{background:none;border:none;color:#9ab0c0;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:10px;font-weight:750}.navbtn span{font-size:22px;line-height:1.1}.navbtn.active{color:var(--lime)}.weekItem{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #283f52;padding:14px 0}.weekItem:last-child{border:none}.weekNumber{height:40px;width:40px;display:grid;place-items:center;border-radius:12px;background:#233747;font-weight:850;color:var(--blue)}.weekItem.active .weekNumber{background:var(--lime);color:#12210b}.weekItem b{font-size:14px}.weekItem p{margin:3px 0 0;font-size:12px;color:var(--sub)}.count{border:1px solid #37515b;background:#223b3b;padding:4px 9px;border-radius:100px;font-weight:800;font-size:11px;color:var(--mint)}.formRow{display:grid;grid-template-columns:1fr 1fr;gap:11px}.label{display:block;font-weight:700;color:#c8d5e0;font-size:12px;margin:8px 0 6px}.field{width:100%;background:#0b1828;color:#f4f6f8;border:1px solid #3c5266;border-radius:11px;padding:11px 12px;min-height:43px}.field:focus{border-color:var(--lime)}.track{border:var(--border);border-radius:var(--radius);background:var(--panel);padding:16px}.log{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #2e4556;font-size:13px}.log:last-child{border:0}.log small{display:block;color:var(--sub)}.chart{width:100%;height:190px;overflow:visible}.error{color:#ffb4a9;font-size:12px;margin-top:5px}.notice{border-left:3px solid var(--mint);padding:12px;background:#19343c;color:#c9e7e6;border-radius:0 12px 12px 0;font-size:12px}.outlineBlock{border:1px solid #334a5a;border-radius:14px;padding:13px;background:#102136;margin-top:10px}.exlist{padding:0;margin:0;list-style:none}.exlist li{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;margin:13px 0}.num{width:39px;height:39px;border-radius:12px;background:#263d4d;color:#dff1ec;display:grid;place-items:center;font-weight:900}.session{padding-top:8px}.session .timerRound{width:208px;height:208px;margin:16px auto;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--lime) var(--deg,100%),#2a4154 0);padding:9px}.timerInner{height:100%;width:100%;border-radius:50%;background:#0b1a2a;display:flex;flex-direction:column;align-items:center;justify-content:center}.time{font-size:58px;letter-spacing:-2px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}.illustration{height:145px;display:grid;place-items:center;background:linear-gradient(135deg,#193747,#12283d);border-radius:22px;overflow:hidden;border:1px solid #31515e}.illustration svg{width:100%;height:140px}.stepTitle{font-size:25px;letter-spacing:-.8px;font-weight:900;line-height:1.15;margin:15px 0 7px}.cue{font-size:14px;line-height:1.6;color:#c4d2dc;min-height:42px}.stepReps{display:inline-block;background:#2b454b;border-radius:9px;color:#c5ffbe;padding:6px 11px;font-weight:840;margin:5px 0 12px}.bottomSteps{background:#15283b;border-radius:15px;padding:13px;margin:17px 0;font-size:12px;color:var(--sub)}.sControls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.resultsHero{text-align:center;padding:36px 0 12px}.resultsHero .medal{font-size:66px}.resultsHero h1{font-size:32px;letter-spacing:-1.3px}.check{display:inline-grid;place-items:center;background:#234f40;color:var(--lime);width:21px;height:21px;border-radius:50%;font-size:12px}.hr{border:0;border-top:1px solid #2c4254;margin:20px 0}.quiet{font-size:11px;color:#849bac}.kpi{font-size:28px;font-weight:850;letter-spacing:-.8px}.h3{font-weight:850;font-size:16px}.toast{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);max-width:90vw;background:var(--lime);color:#16251a;border-radius:14px;padding:12px 17px;font-size:13px;font-weight:800;box-shadow:0 10px 35px #0008;z-index:40}.switchInline{display:flex;align-items:center;justify-content:space-between;gap:10px}.toggler{width:50px;height:29px;background:#374859;border-radius:99px;position:relative;flex-shrink:0;border:none}.toggler:after{content:'';position:absolute;left:4px;top:4px;width:21px;height:21px;background:#dfebf5;border-radius:50%;transition:.17s}.toggler.on{background:#729d61}.toggler.on:after{left:25px;background:#ecffdc}a{color:var(--lime)}
@media(min-width:620px){.app{border-left:1px solid #23394a;border-right:1px solid #23394a}.masthead{padding-top:32px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

/* Version 2: visual training guidance, feedback and personal progress */
.adaptMsg{display:flex;gap:12px;align-items:center;background:#142c33;border:1px solid #38605c;border-radius:16px;padding:12px 14px;margin:0 0 14px}
.adaptIcon{display:grid;place-items:center;background:#28463c;color:var(--lime);border-radius:12px;width:40px;height:40px;font-size:24px;font-weight:900;flex-shrink:0}
.adaptMsg b{font-size:13px;color:#e1f6dc}
.motionCaption{display:flex;align-items:center;gap:7px;color:#91adbb;font-size:10px;font-weight:800;letter-spacing:.7px;margin:6px 3px 0}
.motionDot{height:6px;width:6px;border-radius:99px;background:var(--mint);box-shadow:0 0 0 3px #376254}
.pose{transform-origin:center;animation:pose-swap 2.8s ease-in-out infinite}
.pose-b{animation-name:pose-swap-alt;opacity:0}
@keyframes pose-swap{0%,42%{opacity:1}50%,93%{opacity:0}100%{opacity:1}}
@keyframes pose-swap-alt{0%,42%{opacity:0}50%,93%{opacity:1}100%{opacity:0}}
.feedback{background:#142636;border:1px solid #385265;border-radius:20px;text-align:left;padding:17px;margin-top:21px}
.feedback>b{font-size:17px}
.feelrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.feel{border:1px solid #3e566a;border-radius:15px;background:#1d3146;color:#d7e6f3;padding:14px 8px 10px;font-size:23px;min-height:79px}
.feel span{display:block;font-size:12px;font-weight:750;margin-top:3px}
.feel.active{background:#2c4d39;border-color:var(--lime);color:var(--lime)}
.metric{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2e4556;padding:12px 0;gap:8px}
.metric:first-child{padding-top:0}.metric:nth-child(2){margin-bottom:12px}
.metricBig{font-size:28px;letter-spacing:-1px;font-weight:900}
.metricBig small{font-weight:600;font-size:11px;letter-spacing:0;color:var(--sub)}
.metricMini{font-weight:800;font-size:11px;color:var(--mint);background:#25463d;border-radius:100px;padding:7px 9px;text-align:right}
.trendMsg{border:1px solid #35524f;background:#183234;padding:10px 12px;border-radius:12px;font-size:12px;color:#cee7de;margin:10px 0 15px}
@media(max-width:360px){.h1{font-size:32px}.workout{grid-template-columns:45px 1fr auto;gap:9px}.tile{height:45px;width:45px}.card{padding:14px}.btn{padding:12px 10px}.sControls{gap:6px}.day .date{font-size:13px}.day .dow{font-size:9px}}
@media(prefers-reduced-motion:reduce){.pose{animation:none!important}.pose-b{display:none!important}}

<body>
<div class="app" id="app"></div>
<nav class="footnav" id="nav"></nav>
<script>
(()=>{'use strict';
const KEY='atlet105-v1'; // V2 læser samme lokale historik som første prototype
const localISO=d=>{let dt=d||new Date();return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`};
const dateFromISO=s=>{const p=(s||localISO()).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const addDays=(d,n)=>{let r=new Date(d);r.setDate(r.getDate()+n);return r};
const dayNames=['Søn','Man','Tir','Ons','Tor','Fre','Lør'];
const pretty=(d)=>new Intl.DateTimeFormat('da-DK',{day:'numeric',month:'short',year:'numeric'}).format(d);
const defaultData=()=>({startDate:localISO(),startWeight:120,goalWeight:105,level:'bord',bar:false,voice:false,reminder:'',logs:{},weights:[],tests:[],dayFlags:{}});
let data;try{data={...defaultData(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){data=defaultData()}
if(!data.tests||!Array.isArray(data.tests))data.tests=[];if(!data.logs||typeof data.logs!=='object')data.logs={};if(!Array.isArray(data.weights))data.weights=[];
let tab='today', workout=null, toastTimer=null,timerInterval=null,stepEnd=null,remaining=0,playing=false,showResult=false,lastWorkout=null, currentEasy=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){showToast('Kunne ikke gemme. Eksportér en sikkerhedskopi.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const curWeek=()=>Math.max(1,Math.min(12,Math.floor((dateFromISO(localISO())-dateFromISO(data.startDate))/86400000/7)+1));
const phase=w=>w<=4?'Fundament':w<=8?'Styrke & kontrol':'Atletisk fremgang';
const progressW=()=>{if(data.startWeight<=data.goalWeight)return 0;let weight=latestWeight();return Math.max(0,Math.min(100,100*(data.startWeight-weight)/(data.startWeight-data.goalWeight)))};
const latestWeight=()=>data.weights.length?[...data.weights].sort((a,b)=>a.date.localeCompare(b.date)).at(-1).weight:data.startWeight;
const todayFlags=()=>data.dayFlags[localISO()]||{};
const records=()=>Object.entries(data.logs).map(([key,r])=>({key,...r})).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.time||'').localeCompare(a.time||''));
const completed=(slot,date=localISO())=>records().some(r=>r.date===date&&r.type===slot);
const currentDate=()=>dateFromISO(localISO());
function showToast(s){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2700)}
function section(title,subtitle=''){return `<div class="section"><h2 class="title">${title}</h2>${subtitle?`<p class="subhead">${subtitle}</p>`:''}</div>`}
function stat(v,label){return `<div class="stat"><strong>${v}</strong><span>${label}</span></div>`}
function icon(key){return ({today:'⌂',program:'▦',progress:'↗',settings:'⚙'})[key]}
function nav(){let html=[['today','I dag'],['program','12 uger'],['progress','Udvikling'],['settings','Indstillinger']].map(([key,label])=>`<button class="navbtn ${tab===key?'active':''}" data-tab="${key}" aria-label="${label}"><span>${icon(key)}</span>${label}</button>`).join('');document.getElementById('nav').innerHTML=html;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stopTimer();workout=null;showResult=false;tab=b.dataset.tab;render();window.scrollTo(0,0)})}
function header(){return `<div class="masthead"><div class="logo">ATLET <b>105</b><span style="font-size:8px;color:#9ed5a9;vertical-align:super;margin-left:4px;letter-spacing:.8px">V2</span></div><div class="tag">UGE ${curWeek()} / 12</div></div>`}
function daysStrip(){let dt=currentDate(), monday=addDays(dt,-((dt.getDay()+6)%7));return `<div class="days">${Array.from({length:7},(_,i)=>{const d=addDays(monday,i),ds=localISO(d);const has=completed('am',ds)||completed('pm',ds)||completed('mini',ds);return `<div class="day ${ds===localISO()?'today':''}"><span class="dow">${dayNames[d.getDay()]}</span><span class="date">${d.getDate()}</span><span class="dot ${has?'':'nodot'}"></span></div>`}).join('')}</div>`}

function adaptation(){
 const latest=records().filter(r=>r.type==='am'&&r.level==='fokus'&&r.rating).slice(0,2);
 if(latest.length<2)return {delta:0,label:'Grundprogram',why:'Efter to vurderede fokuspas kan programmet finjusteres.'};
 if(latest.some(r=>r.rating==='hårdt'||r.pain))return {delta:-2,label:'Roligere tempo',why:'Mindst ét af de sidste to fokuspas var hårdt. Vi skruer lidt ned.'};
 if(latest.every(r=>r.rating==='let'))return {delta:2,label:'Klar til fremgang',why:'De to seneste fokuspas var lette. Du får et lille tillæg i gentagelser.'};
 return {delta:0,label:'Stabil progression',why:'Vi holder passende belastning og prioriterer teknikken.'};
}
function trendInfo(){
 const weighted=data.weights.filter(w=>Number.isFinite(Number(w.weight))).map(w=>({date:w.date,weight:Number(w.weight)}));
 if(weighted.length<2)return 'Vej dig flere gange for at se en trend. Enkeltdage kan svinge.';
 const now=dateFromISO(localISO());const recent=weighted.filter(w=>{let delta=(now-dateFromISO(w.date))/86400000;return delta>=0&&delta<7;});
 const earlier=weighted.filter(w=>{let delta=(now-dateFromISO(w.date))/86400000;return delta>=7&&delta<14;});
 if(recent.length&&earlier.length){const mean=xs=>xs.reduce((n,x)=>n+x.weight,0)/xs.length;let d=mean(recent)-mean(earlier);return `Gennemsnit sidste 7 dage: ${mean(recent).toFixed(1).replace('.',',')} kg (${d>0?'+':''}${d.toFixed(1).replace('.',',')} kg mod forrige uge).`}
 return 'Flere ugers vejninger giver et mere stabilt billede end enkeltmålinger.';
}

function main(){const w=curWeek(), flags=todayFlags(),dow=new Date().getDay(),hard=[1,3,5].includes(dow);const easy=flags.strength||flags.run||flags.pain||!hard;const am=recipe('am',w,flags),pm=recipe('pm',w,flags);const doneW=records().filter(r=>new Date(r.date)>=addDays(currentDate(),-6)).length;
return `${header()}<div class="hero"><div class="eyebrow">Din daglige træningscoach</div><div class="h1">Byg styrke.<br><strong>Ét pas ad gangen.</strong></div><p class="sub">Korte calisthenics-pas morgen og aften. Tilpasset ${data.startWeight} → ${data.goalWeight} kg, tidligere løb og styrke — med hensyn til lænd og højre forfod.</p><div style="margin-top:20px"><div class="between" style="font-size:12px;margin-bottom:8px"><b>Mod ${data.goalWeight} kg</b><span>${latestWeight().toFixed(1).replace('.',',')} kg · ${Math.round(progressW())}% af vejen</span></div><div class="progress"><i style="width:${progressW()}%"></i></div></div></div>
<div class="stats">${stat(`Uge ${w}`,phase(w))}${stat(String(doneW),'pas / 7 dage')}${stat((data.startWeight-latestWeight()).toFixed(1).replace('.',','),'kg ændring')}</div>
${section('Din uge','Grøn prik = mindst ét gennemført pas på dagen.')} ${daysStrip()}
${section('Klar til i dag?',`${dayNames[dow]} · ${easy?'Let / tilpasset belastning':'Fokuseret styrke i dag'}`)}<div class="adaptMsg"><span class="adaptIcon">↗</span><div><b>${adaptation().label}</b><div class="smallNote">${adaptation().why}</div></div></div>
<button class="card workout workoutCard" data-start="am"><div class="tile">☀️</div><div><div class="name">Morgen · ${easy?'Rolig start':'Styrkebase'} ${completed('am')?'<span class="check">✓</span>':''}</div><div class="detail">${am.minutes} min · ${am.exercises} øvelser · ${am.level}</div><span class="pill ${completed('am')?'done':'optional'}">${completed('am')?'Gennemført':'Guidet pas'}</span></div><div class="chev">›</div></button>
<button class="card workout workoutCard" data-start="pm"><div class="tile pm">🌙</div><div><div class="name">Aften · Core & ryg ${completed('pm')?'<span class="check">✓</span>':''}</div><div class="detail">${pm.minutes} min · ${pm.exercises} øvelser · rolig afrunding</div><span class="pill ${completed('pm')?'done':'optional'}">${completed('pm')?'Gennemført':'Guidet pas'}</span></div><div class="chev">›</div></button>
<button class="card workout workoutCard" data-start="mini"><div class="tile mini">⚡</div><div><div class="name">Minimumsdagen ${completed('mini')?'<span class="check">✓</span>':''}</div><div class="detail">4–5 min · når kalenderen vælter</div><span class="pill ${completed('mini')?'done':'optional'}">${completed('mini')?'Gennemført':'Valgfri'}</span></div><div class="chev">›</div></button>

const mk=(id,sec,reps='',sets=1,breakSec=15)=>({id,sec,reps,sets,breakSec});
function recipe(type,w,flags={}){let variant='standard';let stages=[];const pain=!!flags.pain;const dow=new Date().getDay();let p=Math.floor((w-1)/2);let pushReps=[8,9,10,11,12,12][Math.min(5,p)],squatReps=[10,12,13,15,16,18][Math.min(5,p)],core=[20,23,25,28,30,35][Math.min(5,p)];let extra=w>=5?1:0;const adaptive=adaptation().delta;pushReps=Math.max(5,pushReps+adaptive);squatReps=Math.max(6,squatReps+adaptive);
if(type==='mini') {variant='minimum';stages=[mk('warm',35,'Rolig opvarmning'),mk('push',40,'6–10 gentagelser'),mk('bridge',40,'10–12 gentagelser'),mk('bird',50,'5 pr. side'),mk('walls',40,'8–10 gentagelser')];}
else if(type==='pm'){variant='restitution';stages=[mk('warm',30,'Roligt'),mk('bird',50,`${5+extra} pr. side`,2,12),mk('bridge',45,`${10+2*extra} gentagelser`,2,12),mk('side',35,`Ca. ${core} sek. samlet; skift side`,2,12),mk('yt',45,'8–12 gentagelser'),mk('mobility',45,'Rolig mobilitet')];if(pain)stages=stages.map(s=>s.id==='side'?{...s,id:'deadbug',reps:'5 pr. side'}:s);}
else{const heavy=[1,3,5].includes(dow)&&!flags.strength&&!flags.run&&!pain; variant=heavy?'fokus':'let';if(heavy){stages=[mk('warm',75,'Opvarmning'),mk('push',50,`${pushReps} gentagelser`,2+(w>=9?1:0),20),mk('squat',55,`${squatReps} gentagelser`,2,20),mk('lunge',60,`${w<=4?5:7} pr. ben`,1+(w>=5?1:0),20),mk('deadbug',50,`${5+extra} pr. side`,2,15),mk(data.bar?'hang':'yt',data.bar?25:45,data.bar?'5–15 sek. eller vælg Y–T–W':'8–12 gentagelser',1)];}
else{stages=[mk('warm',60,'Rolig opvarmning'),mk('push',45,`${Math.max(5,pushReps-3)} lette gentagelser`),mk('hinge',45,'8–10 gentagelser'),mk('bird',50,'5 pr. side'),mk('walls',45,'8 gentagelser'),mk('mobility',40,'Rolig rotation')];}
if(pain)stages=stages.map(s=>s.id==='lunge'?{...s,id:'bridge',reps:'10 rolige gentagelser'}:s);
}
let steps=[];stages.forEach((s,j)=>{for(let i=0;i<s.sets;i++){steps.push({id:s.id,sec:s.sec,reps:s.reps,set:i+1,sets:s.sets});if(i<s.sets-1)steps.push({id:'rest',sec:s.breakSec,reps:'Ryst kroppen løs',set:0,sets:0});}if(j!==stages.length-1)steps.push({id:'rest',sec:15,reps:'Næste øvelse om lidt',set:0,sets:0})});let dur=steps.reduce((n,s)=>n+s.sec,0);return {steps,minutes:Math.max(4,Math.round(dur/60)),exercises:stages.length,level:variant};}

function stepExercise(){let step=workout.recipe.steps[workout.index];if(!step)return null;let actual=step;if(currentEasy&&step.id==='push')actual={...step,id:'push',reps:'Let variant: væg, '+step.reps};if(currentEasy&&step.id==='lunge')actual={...step,id:'bridge',reps:'10 rolige gentagelser'};if(currentEasy&&step.id==='hang')actual={...step,id:'yt',reps:'8 rolige gentagelser'};return actual}
function totalElapsed(){return workout.recipe.steps.slice(0,workout.index).reduce((n,s)=>n+s.sec,0)+(workout.recipe.steps[workout.index]?.sec||0)-remaining}
function startWorkout(type){stopTimer();showResult=false;let r=recipe(type,curWeek(),todayFlags());workout={type,recipe:r,index:0,startTs:Date.now(),pauseSeconds:0};remaining=r.steps[0].sec;playing=false;currentEasy=false;render();window.scrollTo(0,0)}
function stopTimer(){clearInterval(timerInterval);timerInterval=null;playing=false;stepEnd=null}
function setPlaying(on){if(!workout)return;clearInterval(timerInterval);playing=on;if(on){stepEnd=Date.now()+remaining*1000;timerInterval=setInterval(tick,200)}else{remaining=Math.max(0,Math.ceil((stepEnd-Date.now())/1000))}updateTimerUI()}
function tick(){if(!playing||!workout)return;remaining=Math.max(0,Math.ceil((stepEnd-Date.now())/1000));if(remaining===0){beep();advance();return}updateTimerUI()}
function updateTimerUI(){const node=document.getElementById('timerText'),ring=document.getElementById('timerRing'),play=document.getElementById('playButton');if(!node||!workout)return;let st=workout.recipe.steps[workout.index];node.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;if(ring)ring.style.setProperty('--deg',`${100*remaining/st.sec}%`);if(play)play.textContent=playing?'⏸ Pause':'▶ Fortsæt'}
function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();let osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=680;gain.gain.value=.03;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.10);setTimeout(()=>ctx.close(),200)}catch(e){} if(data.voice&&'speechSynthesis'in window&&workout){try{const msg=new SpeechSynthesisUtterance('Næste øvelse');msg.lang='da-DK';msg.rate=1.1;speechSynthesis.speak(msg)}catch(e){}}}
function advance(){if(!workout)return;clearInterval(timerInterval);playing=false;if(workout.index>=workout.recipe.steps.length-1){completeWorkout();return;}workout.index++;remaining=workout.recipe.steps[workout.index].sec;currentEasy=false;render();setPlaying(true)}
function back(){if(!workout)return;stopTimer();workout.index=Math.max(0,workout.index-1);remaining=workout.recipe.steps[workout.index].sec;currentEasy=false;render()}
function completeWorkout(){stopTimer();let type=workout.type;let date=localISO(),dateTime=new Date();let key=`${date}|${type}|${Date.now()}`;let entry={date,time:dateTime.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}),type,duration:workout.recipe.minutes,week:curWeek(),level:workout.recipe.level,pain:!!todayFlags().pain,rating:null};data.logs[key]=entry;save();lastWorkout={...entry,key};workout=null;showResult=true;render();window.scrollTo(0,0)}
function session(){let step=stepExercise(),info=EX[step.id],name=workout.type==='am'?'Morgen':'Aften';if(workout.type==='mini')name='Minimumsdagen';let all=workout.recipe.steps,doneSec=all.slice(0,workout.index).reduce((n,s)=>n+s.sec,0),allSec=all.reduce((n,s)=>n+s.sec,0),percentage=Math.floor(100*doneSec/allSec);let next=all.slice(workout.index+1).find(s=>s.id!=='rest');return `${header()}<div class="session"><div class="between"><button class="btn ghost sm" id="exitSession">← Afslut uden at gemme</button><span class="tag">${name} · ${workout.index+1}/${all.length}</span></div><div style="margin-top:20px"><div class="between" style="font-size:12px;color:var(--sub);margin-bottom:8px"><span>${percentage}% gennemført</span><span>${Math.max(1,Math.round((allSec-doneSec)/60))} min tilbage</span></div><div class="progress"><i style="width:${percentage}%"></i></div></div><div class="timerRound" id="timerRing" style="--deg:${100*remaining/step.sec}%"><div class="timerInner"><span class="eyebrow">${step.id==='rest'?'PAUSE':'TID TIL SÆTTET'}</span><span id="timerText" class="time">${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}</span><span style="font-size:12px;color:var(--sub)">${step.sets>1?`Sæt ${step.set} af ${step.sets}`:step.id==='rest'?'Gør klar':'Dit eget tempo'}</span></div></div><div class="illustration">${art(info.art)}</div><div class="motionCaption"><span class="motionDot"></span> ${['warm','mobility','rest'].includes(info.art)?'VISUEL ØVELSESSKITSE':'ANIMERET ØVELSESSKITSE · START ↔ SLUT'}</div><div class="stepTitle">${info.name}</div><div class="stepReps">${esc(step.reps||'Kontrolleret tempo')}</div><div class="cue">${info.cue}</div><div class="sControls" style="margin-top:16px"><button class="btn secondary" id="playButton">${playing?'⏸ Pause':'▶ Start'}</button><button class="btn" id="nextStep">${workout.index===all.length-1?'✓ Færdig':'✓ Færdig / næste'}</button><button class="btn ghost sm" id="prevStep">← Forrige</button><button class="btn ghost sm" id="makeEasy">${currentEasy?'Vis normal variant':'Gør lettere'}</button></div><div class="bottomSteps"><b>Nemmere variant:</b> ${info.easy}<hr class="hr" style="margin:10px 0">${next?`<b>Kommer snart:</b> ${EX[next.id].name}`:'Sidste trin i passet — stærkt arbejde.'}</div><div class="quiet">Tiden er vejledende. Prioritér kontrolleret teknik og ca. 2–3 gentagelser i reserve. Stop eller vælg en lettere variant ved smerte.</div></div>`}
function results(){return `${header()}<div class="resultsHero"><div class="medal">✦</div><div class="eyebrow">PAS REGISTRERET LOKALT</div><h1>Godt arbejde.</h1><p class="muted">Du bygger kapacitet gennem gentagelser over tid — ikke gennem perfekte dage.</p><div class="stats">${stat(lastWorkout?.duration||0,'minutter')}${stat(curWeek(),'uge i blokken')}${stat(records().length,'pas i alt')}</div><div class="feedback"><b>Hvordan føltes passet?</b><p class="smallNote">Dit svar hjælper appen med at justere kommende fokuspas. Vælg ud fra teknik og hvor meget du havde tilbage.</p><div class="feelrow"><button class="feel ${lastWorkout?.rating==='let'?'active':''}" data-rate="let">🙂<span>Let</span></button><button class="feel ${lastWorkout?.rating==='passende'?'active':''}" data-rate="passende">💪<span>Passende</span></button><button class="feel ${lastWorkout?.rating==='hårdt'?'active':''}" data-rate="hårdt">😮‍💨<span>Hårdt</span></button></div><div class="smallNote" style="margin-top:10px">${lastWorkout?.rating?'Vurderingen er gemt. Tak!':'Vælg gerne en vurdering før du går videre.'}</div></div><button class="btn full" id="homeAgain" style="margin-top:20px">Til dagens overblik</button></div>`}
function program(){let w=curWeek(),phases=[{a:1,b:2,text:'Teknik, kontinuitet, rolig start',push:'2 sæt, 8 gentagelser'},{a:3,b:4,text:'Flere kontrollerede gentagelser',push:'2 sæt, 9–10 gentagelser'},{a:5,b:6,text:'Ét ekstra sæt i enkelte øvelser',push:'2 sæt, 10–12 gentagelser'},{a:7,b:8,text:'Bedre kvalitet og længere core-tid',push:'2 sæt, 11–14 gentagelser'},{a:9,b:10,text:'Valgfrit tredje armbøjningssæt',push:'Op til 3 sæt, 12 gentagelser'},{a:11,b:12,text:'Konsolidering før ny træningsblok',push:'Op til 3 sæt, 12 gentagelser'}];return `${header()}<div class="eyebrow">Din plan</div><h1 class="h1">12 uger til<br><span style="color:var(--lime)">en stærkere base.</span></h1><p class="subhead">Dit tidligere aftalte morgen-/aftenprogram — gjort guidet, skalerbart og lettere at bruge i hverdagen. Nuværende fase: <b style="color:var(--lime)">${phase(w)}</b>.</p><div class="card"><div class="between"><div><div class="eyebrow">Den ugentlige rytme</div><div class="h3">Morgen + aften som vaner</div></div><div style="font-size:30px">♻️</div></div><p class="smallNote"><b>Man / ons / fre:</b> fokus-morgen hvis du ikke styrketræner eller har behov for skånehensyn.<br><b>Tir / tor:</b> let morgen som supplement til løb eller anden træning.<br><b>Lør / søn:</b> rolige pas og fleksibel restitution.<br><b>Aften:</b> ryg, balle og core uden jag efter høj puls.</p><div class="notice">Løb og målrettet styrketræning kan fortsætte ved siden af. De daglige minipas er ikke tænkt som erstatning for målrettet ryg-/trækstyrke eller konditionstræning.</div></div><div class="section"><h2 class="title">Progression</h2></div><div class="card">${phases.map((p,i)=>`<div class="weekItem ${w>=p.a&&w<=p.b?'active':''}"><div class="weekNumber">${p.a}–${p.b}</div><div><b>${p.text}</b><p>${p.push}</p></div><span class="count">${w>p.b?'✓':w>=p.a&&w<=p.b?'NU':'SENERE'}</span></div>`).join('')}</div><div class="card"><b>Progression efter dine præstationer</b><p class="smallNote">Hold ca. 2–3 gentagelser i reserve. Appen giver et beskedent ekstra tillæg, når du registrerer to lette fokuspas; ved et hårdt fokuspas dæmpes næste progression. Sænk først armbøjnings-støtten, når den aktuelle variant er stabil med god teknik. Gulvarmbøjninger er ikke et krav. Ingen hop eller burpees i grundprogrammet.</p><p class="smallNote">Ved smerter i lænd eller forfod: skift til let variant eller stop. Forværring af symptomer bør vurderes af relevant sundhedsperson.</p></div>`}
function weightChart(){let ws=[{date:data.startDate,weight:data.startWeight},...data.weights].sort((a,b)=>a.date.localeCompare(b.date));if(data.weights.some(w=>w.date===data.startDate))ws=ws.filter((w,i)=>!(i===0&&w.date===data.startDate));if(ws.length<2)return `<div class="smallNote" style="padding:35px 10px;text-align:center">Registrér din første vejning for at vise udviklingen her.</div>`;let low=Math.min(...ws.map(x=>x.weight),data.goalWeight)-1,high=Math.max(...ws.map(x=>x.weight),data.startWeight)+1,win=310,h=150;const x=i=>24+i/Math.max(1,ws.length-1)*270;const y=v=>12+(high-v)/(high-low)*125;let poly=ws.map((v,i)=>`${x(i)},${y(v.weight)}`).join(' ');return `<svg class="chart" viewBox="0 0 340 180" role="img" aria-label="Kurve over dine registrerede vægte"><line x1="24" y1="${y(data.goalWeight)}" x2="320" y2="${y(data.goalWeight)}" stroke="#8aa775" stroke-dasharray="4 5"/><text x="23" y="${Math.max(10,y(data.goalWeight)-7)}" fill="#c4f56e" font-size="10">Mål: ${data.goalWeight} kg</text><polyline fill="none" stroke="#80ddba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>${ws.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v.weight)}" r="4" fill="#c4f56e"/>`).join('')}<text x="24" y="171" fill="#a8bfce" font-size="10">${esc(ws[0].date)}</text><text x="320" y="171" fill="#a8bfce" font-size="10" text-anchor="end">${esc(ws.at(-1).date)}</text></svg>`}
function progress(){const recs=records(),lbs=data.startWeight-latestWeight(),weekStart=addDays(currentDate(),-((currentDate().getDay()+6)%7)),completedThisWeek=recs.filter(r=>dateFromISO(r.date)>=weekStart).length;let tests=[...data.tests].sort((a,b)=>b.date.localeCompare(a.date));let pushTests=tests.filter(t=>t.type==='push'&&t.level===data.level);let coreTests=tests.filter(t=>t.type==='plank');return `${header()}<div class="eyebrow">Din fremgang</div><h1 class="h1">Bliv stærkere.<br><span style="color:var(--lime)">Følg udviklingen.</span></h1><div class="stats">${stat((latestWeight()).toFixed(1).replace('.',','),'kg senest')}${stat(lbs.toFixed(1).replace('.',','),'kg ændring')}${stat(completedThisWeek,'pas denne uge')}</div><div class="section"><h2 class="title">Vægt · ${data.startWeight} → ${data.goalWeight} kg</h2></div><div class="track">${weightChart()}<div class="trendMsg">${trendInfo()}</div><div class="formRow"><div><label class="label" for="weightDate">Dato</label><input class="field" type="date" id="weightDate" value="${localISO()}"/></div><div><label class="label" for="weightInput">Vægt i kg</label><input class="field" inputmode="decimal" type="number" min="40" max="250" step="0.1" id="weightInput" placeholder="fx 119,4"/></div></div><button class="btn full" id="addWeight" style="margin-top:13px">Gem vejning</button><p class="quiet">Vægt svinger fra dag til dag. 105 kg er et langsigtet mål, ikke en forventning om 15 kg på 12 uger.</p></div><div class="section"><h2 class="title">Styrke og kropskontrol</h2><p class="subhead">Registrér en kontrolleret test cirka hver 2. uge. Ingen test til udmattelse.</p></div><div class="card"><div class="metric"><div><span class="eyebrow">Armbøjninger · ${data.level}</span><div class="metricBig">${pushTests[0]?.value??'—'} <small>gode gentagelser</small></div></div><span class="metricMini">${pushTests.length>=2?`${pushTests[0].value-pushTests[1].value>=0?'+':''}${pushTests[0].value-pushTests[1].value} siden sidst`:'Første måling'}</span></div><div class="metric"><div><span class="eyebrow">Planke</span><div class="metricBig">${coreTests[0]?.value??'—'} <small>sekunder</small></div></div><span class="metricMini">${coreTests.length>=2?`${coreTests[0].value-coreTests[1].value>=0?'+':''}${coreTests[0].value-coreTests[1].value} sek. siden sidst`:'Første måling'}</span></div><label class="label" for="testType">Måling</label><div class="formRow"><select class="field" id="testType"><option value="push">Armbøjninger (${data.level})</option><option value="plank">Planke (sekunder)</option></select><input class="field" id="testValue" type="number" min="1" max="180" step="1" placeholder="Antal / sek." inputmode="numeric"/></div><button class="btn secondary full" id="addTest" style="margin-top:12px">Registrér styrkemåling</button><p class="quiet">Brug samme udførelse hver gang; armbøjningsniveauet vælges under Indstillinger. Stop med ca. 2 gentagelser i reserve.</p></div><div class="section"><h2 class="title">Træningshistorik</h2></div><div class="card">${recs.length?recs.slice(0,35).map(r=>`<div class="log"><span><b>${r.type==='am'?'☀️ Morgen':r.type==='pm'?'🌙 Aften':'⚡ Minimum'}</b><small>${pretty(dateFromISO(r.date))} · ${esc(r.time)} · ${r.rating?esc(r.rating):'ikke vurderet'}</small></span><b>${r.duration} min</b></div>`).join(''):'<p class="smallNote">Endnu ingen gennemførte pas. Første registrering kommer automatisk efter træning.</p>'}</div>`}
function settings(){return `${header()}<div class="eyebrow">Din profil</div><h1 class="h1">Appen skal<br><span style="color:var(--lime)">passe til dig.</span></h1><div class="card"><div class="h3">Mål og træningsblok</div><div class="formRow"><div><label class="label" for="startWeight">Startvægt (kg)</label><input class="field" id="startWeight" type="number" min="40" max="250" step="0.1" value="${data.startWeight}"></div><div><label class="label" for="goalWeight">Målvægt (kg)</label><input class="field" id="goalWeight" type="number" min="40" max="250" step="0.1" value="${data.goalWeight}"></div></div><label class="label" for="startDate">Startdato for de 12 uger</label><input class="field" style="width:100%" id="startDate" type="date" value="${esc(data.startDate)}"><label class="label" for="pushLevel">Armbøjningsniveau</label><select class="field" id="pushLevel"><option value="væg" ${data.level==='væg'?'selected':''}>Mod væg · lettest</option><option value="bord" ${data.level==='bord'?'selected':''}>Mod stabilt bord / køkkenbord</option><option value="gulv" ${data.level==='gulv'?'selected':''}>På gulv · tungere</option></select><div class="smallNote" style="margin-top:10px">Dit niveau styrer instruktionen, ikke en tvungen progression. Tilpas på dagen.</div><button class="btn full" id="saveSettings" style="margin-top:14px">Gem indstillinger</button></div><div class="card"><div class="switchInline"><div><b>Jeg har en solid pullup-stang</b><div class="smallNote">Kort hang kan erstatte Y–T–W på fokuserede dage. Skal være godkendt til din faktiske kropsvægt.</div></div><button class="toggler ${data.bar?'on':''}" data-toggle="bar" aria-label="Har pullup-stang" aria-pressed="${data.bar}"></button></div><hr class="hr"><div class="switchInline"><div><b>Oplæst næste øvelse</b><div class="smallNote">Forsøgsfunktion, afhænger af browser og telefonens lydtilstand.</div></div><button class="toggler ${data.voice?'on':''}" data-toggle="voice" aria-label="Oplæst næste øvelse" aria-pressed="${data.voice}"></button></div></div><div class="card"><b>Mine data</b><p class="smallNote">Alle vejninger, styrketests og pas gemmes lokalt i appens browserlager. Appen sender dem ingen steder. Sletning af app-/webstedsdata kan dog fjerne historikken, så eksportér en backup jævnligt.</p><div class="sControls"><button class="btn secondary sm" id="export">↓ Eksportér data</button><label class="btn ghost sm" for="import" style="text-align:center">↑ Importér data</label><input type="file" accept="application/json" id="import" style="display:none"></div><button class="btn danger full" id="clearLocal" style="margin-top:12px">Slet alle lokale data</button></div><div class="notice"><b>Bemærk:</b> Appens øvelsesanimationer er skematiske, ikke professionelt optagede instruktionsvideoer. Dette er en personlig prototype og ikke en medicinsk vurdering. Smerter, hævelse eller føleforstyrrelser er signal til at reducere belastning og eventuelt søge faglig rådgivning.</div>`}
function render(){document.getElementById('app').innerHTML=workout?session():showResult?results():tab==='today'?main():tab==='program'?program():tab==='progress'?progress():settings();document.getElementById('nav').style.display=workout?'none':'grid';hook();nav()}
function hook(){if(workout){document.getElementById('exitSession').onclick=()=>{if(confirm('Afslut passet uden at gemme?')){stopTimer();workout=null;render()}};document.getElementById('playButton').onclick=()=>setPlaying(!playing);document.getElementById('nextStep').onclick=()=>{beep();advance()};document.getElementById('prevStep').onclick=back;document.getElementById('makeEasy').onclick=()=>{const oldRemaining=remaining;const oldPlay=playing;stopTimer();currentEasy=!currentEasy;render();remaining=oldRemaining;updateTimerUI();if(oldPlay)setPlaying(true)};return;}if(showResult){document.getElementById('homeAgain').onclick=()=>{showResult=false;tab='today';render()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{if(!lastWorkout)return;let rating=b.dataset.rate;data.logs[lastWorkout.key].rating=rating;lastWorkout.rating=rating;save();render();showToast('Træningsvurdering gemt ✓')});return;}
document.querySelectorAll('[data-start]').forEach(el=>el.onclick=()=>startWorkout(el.dataset.start));document.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{let f=todayFlags();f[b.dataset.flag]=!f[b.dataset.flag];data.dayFlags[localISO()]=f;save();render()});
if(tab==='progress'){document.getElementById('addTest').onclick=()=>{let type=document.getElementById('testType').value,value=Number(document.getElementById('testValue').value);if(!Number.isInteger(value)||value<1||value>180){showToast('Indtast et helt antal mellem 1 og 180');return;}data.tests=data.tests.filter(t=>!(t.date===localISO()&&t.type===type&&(type!=='push'||t.level===data.level)));data.tests.push({date:localISO(),type,value,level:type==='push'?data.level:null});save();render();showToast('Styrkemåling gemt ✓')};document.getElementById('addWeight').onclick=()=>{let weight=Number(document.getElementById('weightInput').value),date=document.getElementById('weightDate').value;if(!date||!Number.isFinite(weight)||weight<40||weight>250){showToast('Indtast en gyldig dato og vægt');return;}data.weights=data.weights.filter(w=>w.date!==date);data.weights.push({date,weight});save();render();showToast('Vejning gemt ✓')};}
if(tab==='settings'){document.getElementById('clearLocal').onclick=()=>{if(confirm('Slette ALLE vejninger, styrkemålinger og træningspas på denne enhed? Handlingen kan kun fortrydes med en tidligere backup.')){if(confirm('Er du sikker på, at alle data skal slettes?')){data=defaultData();save();render();showToast('Lokale data slettet')}}};document.getElementById('saveSettings').onclick=()=>{let sw=Number(document.getElementById('startWeight').value),gw=Number(document.getElementById('goalWeight').value),sd=document.getElementById('startDate').value;if(!sd||!Number.isFinite(sw)||!Number.isFinite(gw)||sw<40||sw>250||gw<40||gw>250||gw>=sw){showToast('Kontrollér vægtmål og startdato');return;}data.startDate=sd;data.startWeight=sw;data.goalWeight=gw;data.level=document.getElementById('pushLevel').value;save();render();showToast('Indstillinger gemt ✓')};document.querySelectorAll('[data-toggle]').forEach(t=>t.onclick=()=>{data[t.dataset.toggle]=!data[t.dataset.toggle];save();render()});document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`atlet105-backup-${localISO()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)};document.getElementById('import').onchange=async ev=>{let file=ev.target.files?.[0];if(!file)return;try{let v=JSON.parse(await file.text());if(!v.logs||!v.weights||!v.startDate||!Array.isArray(v.weights))throw Error('format');if(confirm('Dette erstatter de aktuelle data med den importerede backup. Fortsæt?')){data={...defaultData(),...v,tests:Array.isArray(v.tests)?v.tests:[]};save();render();showToast('Data indlæst')}}catch(e){showToast('Backup kunne ikke indlæses')}};}
}
// Give selected push-up level visible instructions without hard-coding it in the source exercise library.
const basePush=EX.push.cue;const originalSession=session;session=function(){let html=originalSession();let position={væg:'mod væg',bord:'mod et stabilt bord',gulv:'på gulvet'}[data.level];if(workout&&stepExercise()?.id==='push'){html=html.replace(basePush,`Din valgte variant: <b>${position}</b>. ${basePush}`)}return html};
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&playing)tick()});
window.addEventListener('beforeunload',()=>save());
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
</script>
